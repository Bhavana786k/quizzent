spring.application.name=quizzent-backend
server.port=${SERVER_PORT:8082}

# Database Configuration (MySQL as primary, H2 fallback if MySQL credentials not set)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/quizzent_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fallback to H2 in memory if MySQL connection fails during startup (spring profile / auto-detect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=9a2f8c4e6b1d3a7e5f9c2b4d6a8e0f1c3b5a7d9e1f3c5b7a9d2e4f6a8c0b2d4e
app.jwt.expiration-ms=86400000

# File Storage Configuration
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
